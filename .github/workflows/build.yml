name: Build

on:
  pull_request:
  push:
    branches: [main, Development]
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag in the comment); Dependabot (.github/dependabot.yml) bumps them.
env:
  # Roku's Static Channel Analysis tool, checked against this SHA-256 before it runs. Roku publishes it at a
  # fixed, unversioned URL, so when Roku updates it this step fails with "sca-cmd.zip checksum mismatch".
  # To update: download it, check it (e.g. run it locally on out/cove-roku.zip), then paste the new sum here:
  #   curl -sSL -o sca.zip https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip && sha256sum sca.zip
  SCA_URL: https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip
  SCA_SHA256: 4716eff1621cbe17a0c532a300b17df7a7139aa181f8496c179a9b84f2cc9e4f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.js "${GITHUB_REF_NAME}" "${GITHUB_RUN_NUMBER}"
      - name: Lint and build (BrighterScript + bslint)
        run: npm run build
      - name: Check the package
        run: |
          unzip -l out/cove-roku.zip
          unzip -p out/cove-roku.zip manifest
          sha256sum out/cove-roku.zip | tee /tmp/cove-roku.sha256
      # The artifact is uploaded before any third-party tool runs, so what ships is exactly what was built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cove-roku
          path: out/cove-roku.zip
      # Roku's own Static Channel Analysis (the check the Developer Dashboard runs on upload): fail on errors.
      # It runs on a copy of the zip, outside the workspace.
      - name: Roku static analysis
        run: |
          mkdir -p /tmp/sca
          curl -sSL --fail -o /tmp/sca/sca.zip "$SCA_URL"
          echo "$SCA_SHA256  /tmp/sca/sca.zip" | sha256sum -c - || { echo "::error::sca-cmd.zip checksum mismatch (Roku updated it? see SCA_SHA256 in build.yml)"; exit 1; }
          unzip -q /tmp/sca/sca.zip -d /tmp/sca
          cp out/cove-roku.zip /tmp/sca/app.zip
          java -jar /tmp/sca/sca-cmd/lib/sca-cmd.jar /tmp/sca/app.zip --severity warning | tee /tmp/sca/sca.txt
          if grep -q '^\[ERROR\]' /tmp/sca/sca.txt; then echo "::error::Roku static analysis reported errors"; exit 1; fi
      - name: The package is unchanged
        run: sha256sum -c /tmp/cove-roku.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-roku
      - name: Checksums
        run: sha256sum cove-roku.zip | tee SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" cove-roku.zip SHA256SUMS.txt -R "${GITHUB_REPOSITORY}" --draft --title "Cove for Roku ${GITHUB_REF_NAME}" --generate-notes
