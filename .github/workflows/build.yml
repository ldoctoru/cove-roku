name: Build

on:
  pull_request:
  push:
    branches: [main, Development]
    tags: ["v*"]

permissions:
  contents: read

# One run per branch / PR at a time: a newer push cancels an older PR run; pushes to main / Development and
# tag builds always finish (they queue instead)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (the tag in the comment); Dependabot (.github/dependabot.yml) bumps them.
env:
  # Roku's Static Channel Analysis tool, checked against this SHA-256 before it runs. Roku publishes it at a
  # fixed, unversioned URL, so when Roku updates it this step fails with "sca-cmd.zip checksum mismatch".
  # To update: download it, check it (e.g. run it locally on out/cove-roku.zip), then paste the new sum here:
  #   curl -sSL -o sca.zip https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip && sha256sum sca.zip
  SCA_URL: https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip
  SCA_SHA256: 4716eff1621cbe17a0c532a300b17df7a7139aa181f8496c179a9b84f2cc9e4f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when the tag isn't the package.json version (the version PR was forgotten), then stamps the build
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.js --tag "${GITHUB_REF_NAME}" "${GITHUB_RUN_NUMBER}"
      - name: Lint and build (BrighterScript + bslint)
        run: npm run build
      # BrightScript unit tests on the build output (Node interpreter) and the scripts' tests
      - name: Unit tests
        run: npm test
      - name: Check the package
        run: |
          unzip -l out/cove-roku.zip
          unzip -p out/cove-roku.zip manifest
          sha256sum out/cove-roku.zip | tee /tmp/cove-roku.sha256
      # The artifact is uploaded before any third-party tool runs, so what ships is exactly what was built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cove-roku
          path: out/cove-roku.zip
      # Roku's own Static Channel Analysis (the check the Developer Dashboard runs on upload): fail on errors.
      # It runs on a copy of the zip, outside the workspace.
      - name: Roku static analysis
        run: |
          mkdir -p /tmp/sca
          curl -sSL --fail -o /tmp/sca/sca.zip "$SCA_URL"
          echo "$SCA_SHA256  /tmp/sca/sca.zip" | sha256sum -c - || { echo "::error::sca-cmd.zip checksum mismatch (Roku updated it? see SCA_SHA256 in build.yml)"; exit 1; }
          unzip -q /tmp/sca/sca.zip -d /tmp/sca
          cp out/cove-roku.zip /tmp/sca/app.zip
          java -jar /tmp/sca/sca-cmd/lib/sca-cmd.jar /tmp/sca/app.zip --severity warning | tee /tmp/sca/sca.txt
          if grep -q '^\[ERROR\]' /tmp/sca/sca.txt; then echo "::error::Roku static analysis reported errors"; exit 1; fi
      - name: The package is unchanged
        run: sha256sum -c /tmp/cove-roku.sha256

  # The committed UI images must be exactly what scripts/make-ui-assets.py makes with the pinned Pillow
  # (scripts/requirements.txt, hash-checked) and the vendored font
  ui-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r scripts/requirements.txt
      - name: Regenerate src/images/ui
        run: python scripts/make-ui-assets.py
      - name: The images are unchanged
        run: |
          git status --porcelain -- src/images/ui
          git diff --exit-code --stat -- src/images/ui
          if [ -n "$(git status --porcelain -- src/images/ui)" ]; then echo "::error::src/images/ui differs from scripts/make-ui-assets.py output: run it and commit the images"; exit 1; fi

  release:
    needs: [build, ui-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # (id-token + attestations: only here, for the build provenance attestation of the release zip)
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cove-roku
      - name: Checksums
        run: sha256sum cove-roku.zip | tee SHA256SUMS.txt
      # Signed SLSA build provenance for the zip (verify: gh attestation verify cove-roku.zip -R ldoctoru/cove-roku)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: cove-roku.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" cove-roku.zip SHA256SUMS.txt -R "${GITHUB_REPOSITORY}" --draft --title "Cove for Roku ${GITHUB_REF_NAME}" --generate-notes
