name: Build

on:
  pull_request:
  push:
    branches: [main, Development]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.js "${GITHUB_REF_NAME}" "${GITHUB_RUN_NUMBER}"
      - name: Lint and build (BrighterScript + bslint)
        run: npm run build
      - name: Check the package
        run: |
          unzip -l out/cove-roku.zip
          unzip -p out/cove-roku.zip manifest
      # Roku's own Static Channel Analysis (the check the Developer Dashboard runs on upload): fail on errors
      - name: Roku static analysis
        run: |
          curl -sSL -o /tmp/sca.zip https://devtools.web.roku.com/static-channel-analysis/sca-cmd.zip
          unzip -q /tmp/sca.zip -d /tmp
          java -jar /tmp/sca-cmd/lib/sca-cmd.jar out/cove-roku.zip --severity warning | tee /tmp/sca.txt
          if grep -q '^\[ERROR\]' /tmp/sca.txt; then echo "::error::Roku static analysis reported errors"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cove-roku
          path: out/cove-roku.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cove-roku
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" cove-roku.zip -R "${GITHUB_REPOSITORY}" --draft --title "Cove for Roku ${GITHUB_REF_NAME}" --generate-notes
